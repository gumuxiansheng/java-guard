name: Release

# 在 push tag 时自动构建并保留制品：
#   1. 上传 GitHub Actions 制品（保留 90 天）
#   2. 创建 GitHub Release 并把构建产物作为永久的 Release 资源附加
# 同时支持手动触发（workflow_dispatch）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (JDK, Maven, cross linkers)
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jdk maven gcc-aarch64-linux-gnu gcc-mingw-w64

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-pc-windows-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build java-parser.jar
        run: |
          (cd java-parser && mvn -B clean package -DskipTests)
          mkdir -p dist
          cp java-parser/target/java-parser.jar dist/java-parser.jar

      - name: Build linux x86_64
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/java-guard dist/java-guard-linux-amd64

      - name: Build linux aarch64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu
          cp target/aarch64-unknown-linux-gnu/release/java-guard dist/java-guard-linux-arm64

      - name: Build windows x86_64
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          cargo build --release --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/java-guard.exe dist/java-guard-windows-amd64.exe

      - name: List dist
        run: ls -la dist

      # 保留制品：上传为 GitHub Actions 制品（默认保留 90 天，可被 Release 资源长期留存覆盖）
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: java-guard-dist
          path: dist/*
          retention-days: 90

      # 保留制品：创建 GitHub Release 并附加构建产物（永久保存）
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
