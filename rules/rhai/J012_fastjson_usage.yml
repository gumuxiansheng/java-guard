id: J012
title: "禁止在代码中直接使用 fastjson / fastjson2 的类"
severity: major
category: security
enabled: true
script: |
  // 与 J010（检查 import 语句）互补：本规则检查「代码中对 fastjson 类的实际使用点」。
  // 增量扫描（--diff）下，import 行往往不在变更范围内，导致 J010 漏报；
  // 本规则在「使用行」上报，使用行即为变更行，因此增量模式下依然有效。
  // 覆盖两类用法：
  //   1) 全限定名（无 import）：com.alibaba.fastjson.JSON.parseObject(...)
  //   2) 简单名（已有 import）：JSON.parseObject(...)，通过 import 反查归属 fastjson 包

  let FJ = "com.alibaba.fastjson";

  // 收集从 fastjson 包 import 进来的简单类名（如 JSON / JSONObject）
  let imported = [];
  let imports = ast["imports"];
  if imports != () {
    for imp in imports {
      let pkg = imp["package"];
      let name = pkg;
      if name.ends_with(".*") { name = name.sub_string(0, len(name) - 2); }
      if name.starts_with(FJ) {
        let parts = name.split('.');
        let simple = parts[len(parts) - 1];
        if simple != "fastjson" { imported.push(simple); }
      }
    }
  }

  fn walk_expr(e, imported, fj) {
    let vs = [];
    if e.type_of() != "map" { return vs; }
    let kind = e["kind"];
    if kind == "MethodCallExpr" {
      let callee = e["callee"];
      if callee != () {
        if callee.contains(fj) { vs.push(#{ line: e["line"], msg: "禁止使用 fastjson / fastjson2（" + callee + "），请改用 jackson（com.fasterxml.jackson）" }); }
        else if callee in imported { vs.push(#{ line: e["line"], msg: "禁止使用 fastjson（" + callee + "），请改用 jackson（com.fasterxml.jackson）" }); }
      }
      let args = e["arguments"];
      if args != () { for a in args { vs = vs + walk_expr(a, imported, fj); } }
      return vs;
    }
    if kind == "ObjectCreationExpr" {
      let cn = e["class_name"];
      if cn.contains(fj) { vs.push(#{ line: e["line"], msg: "禁止使用 fastjson / fastjson2（" + cn + "），请改用 jackson（com.fasterxml.jackson）" }); }
      else if cn in imported { vs.push(#{ line: e["line"], msg: "禁止使用 fastjson（" + cn + "），请改用 jackson（com.fasterxml.jackson）" }); }
      let args = e["arguments"];
      if args != () { for a in args { vs = vs + walk_expr(a, imported, fj); } }
      return vs;
    }
    if kind == "CastExpr" {
      let ct = e["cast_type"];
      if ct.contains(fj) { vs.push(#{ line: e["line"], msg: "禁止使用 fastjson / fastjson2（" + ct + "），请改用 jackson（com.fasterxml.jackson）" }); }
      vs = vs + walk_expr(e["expr"], imported, fj);
      return vs;
    }
    if kind == "InstanceOfExpr" {
      let ct = e["check_type"];
      if ct.contains(fj) { vs.push(#{ line: e["line"], msg: "禁止使用 fastjson / fastjson2（" + ct + "），请改用 jackson（com.fasterxml.jackson）" }); }
      vs = vs + walk_expr(e["expr"], imported, fj);
      return vs;
    }
    if kind == "FieldAccessExpr" { return vs + walk_expr(e["target"], imported, fj); }
    if kind == "EnclosedExpr" { return vs + walk_expr(e["inner"], imported, fj); }
    if kind == "BinaryExpr" { return vs + walk_expr(e["left"], imported, fj) + walk_expr(e["right"], imported, fj); }
    if kind == "UnaryExpr" { return vs + walk_expr(e["expr"], imported, fj); }
    if kind == "AssignExpr" { return vs + walk_expr(e["target"], imported, fj) + walk_expr(e["value"], imported, fj); }
    if kind == "VariableDeclarationExpr" {
      let decls = e["declarations"];
      if decls != () { for d in decls { if d["initializer"] != () { vs = vs + walk_expr(d["initializer"], imported, fj); } } }
      return vs;
    }
    if kind == "MethodReferenceExpr" {
      let t = e["target"];
      if t.type_of() == "string" && t.contains(fj) { vs.push(#{ line: e["line"], msg: "禁止使用 fastjson / fastjson2（" + t + "），请改用 jackson（com.fasterxml.jackson）" }); }
      return vs;
    }
    return vs;
  }

  fn walk_stmt(s, imported, fj) {
    let vs = [];
    if s.type_of() != "map" { return vs; }
    let kind = s["kind"];
    if kind == "BlockStmt" {
      let stmts = s["statements"];
      if stmts != () { for x in stmts { vs = vs + walk_stmt(x, imported, fj); } }
      return vs;
    }
    if kind == "IfStmt" {
      if s["condition"] != () { vs = vs + walk_expr(s["condition"], imported, fj); }
      if s["then_stmt"] != () { vs = vs + walk_stmt(s["then_stmt"], imported, fj); }
      if s["else_stmt"] != () { vs = vs + walk_stmt(s["else_stmt"], imported, fj); }
      return vs;
    }
    if kind == "ExpressionStmt" {
      if s["expr"] != () { vs = vs + walk_expr(s["expr"], imported, fj); }
      return vs;
    }
    if kind == "ReturnStmt" {
      if s["expr"] != () { vs = vs + walk_expr(s["expr"], imported, fj); }
      return vs;
    }
    if kind == "VariableDeclarationStmt" {
      let decls = s["declarations"];
      if decls != () { for d in decls { if d["initializer"] != () { vs = vs + walk_expr(d["initializer"], imported, fj); } } }
      return vs;
    }
    if kind == "ForStmt" {
      if s["initialization"] != () { vs = vs + walk_expr(s["initialization"], imported, fj); }
      if s["condition"] != () { vs = vs + walk_expr(s["condition"], imported, fj); }
      if s["update"] != () { for u in s["update"] { vs = vs + walk_expr(u, imported, fj); } }
      if s["body"] != () { vs = vs + walk_stmt(s["body"], imported, fj); }
      return vs;
    }
    if kind == "ForEachStmt" {
      vs = vs + walk_expr(s["variable"], imported, fj);
      vs = vs + walk_expr(s["iterable"], imported, fj);
      if s["body"] != () { vs = vs + walk_stmt(s["body"], imported, fj); }
      return vs;
    }
    if kind == "WhileStmt" {
      if s["condition"] != () { vs = vs + walk_expr(s["condition"], imported, fj); }
      if s["body"] != () { vs = vs + walk_stmt(s["body"], imported, fj); }
      return vs;
    }
    if kind == "DoStmt" {
      if s["body"] != () { vs = vs + walk_stmt(s["body"], imported, fj); }
      if s["condition"] != () { vs = vs + walk_expr(s["condition"], imported, fj); }
      return vs;
    }
    if kind == "TryStmt" {
      if s["try_body"] != () { vs = vs + walk_stmt(s["try_body"], imported, fj); }
      if s["finally_body"] != () { vs = vs + walk_stmt(s["finally_body"], imported, fj); }
      let catches = s["catch_clauses"];
      if catches != () { for c in catches { if c["body"] != () { vs = vs + walk_stmt(c["body"], imported, fj); } } }
      return vs;
    }
    if kind == "ThrowStmt" {
      if s["expr"] != () { vs = vs + walk_expr(s["expr"], imported, fj); }
      return vs;
    }
    if kind == "SynchronizedStmt" {
      if s["expr"] != () { vs = vs + walk_expr(s["expr"], imported, fj); }
      if s["body"] != () { vs = vs + walk_stmt(s["body"], imported, fj); }
      return vs;
    }
    if kind == "SwitchStmt" {
      if s["selector"] != () { vs = vs + walk_expr(s["selector"], imported, fj); }
      let cases = s["cases"];
      if cases != () { for c in cases { let cs = c["statements"]; if cs != () { for x in cs { vs = vs + walk_stmt(x, imported, fj); } } } }
      return vs;
    }
    return vs;
  }

  fn walk_member(m, imported, fj) {
    let vs = [];
    let kind = m["kind"];
    if kind == "MethodDeclaration" || kind == "ConstructorDeclaration" {
      if m["body"] != () { vs = vs + walk_stmt(m["body"], imported, fj); }
      return vs;
    }
    if kind == "ClassDeclaration" || kind == "InterfaceDeclaration" ||
       kind == "EnumDeclaration" || kind == "AnnotationDeclaration" {
      let members = m["members"];
      if members != () { for x in members { vs = vs + walk_member(x, imported, fj); } }
      return vs;
    }
    if kind == "FieldDeclaration" {
      if m["initializer"] != () { vs = vs + walk_expr(m["initializer"], imported, fj); }
      return vs;
    }
    if kind == "InitializerDeclaration" {
      if m["body"] != () { vs = vs + walk_stmt(m["body"], imported, fj); }
      return vs;
    }
    return vs;
  }

  let violations = [];
  let types = ast["types"];
  if types != () {
    for t in types { violations = violations + walk_member(t, imported, FJ); }
  }

  // 将 {line, msg} 转为引擎要求的 {line, message}
  let out = [];
  for v in violations { out.push(#{ line: v["line"], message: v["msg"] }); }
  out
